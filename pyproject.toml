[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]

[tool.poetry]
authors = [
    "shengzhe.li <shengzhe.li@sbintuitions.co.jp>",
    "ryokan.ri <ryokan.ri@sbintuitions.co.jp>",
    "masaya.ohagi <masaya.ohagi@sbintuitions.co.jp>",
    "akihiko.fukuchi <akihiko.fukuchi@sbintuitions.co.jp>"
]
description = "The evaluation scripts for JMTEB (Japanese Massive Text Embedding Benchmark)"
name = "JMTEB"
packages = [{from = "src", include = "jmteb"}]
readme = "README.md"
version = "2.0.0"

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
# Core dependencies (v2)
mteb = ">=2.4.2"
sentence-transformers = ">=5.1.1"
torch = ">=2.6.0"
numpy = ">=1.26,<3.0.0"
pyyaml = "^6.0"
loguru = ">=0.7.3"
scikit-learn = ">=1.4.0"
transformers = {version = ">=4.57.1", extras = ["ja", "sentencepiece"]}
accelerate = ">=0.31.0"
tqdm = ">=4.0.0"
rich = ">=13.0.0"
openai = ">=1.41.0"
tiktoken = ">=0.8.0"
datasets = ">=2.19.0"
jsonargparse = {extras = ["jsonnet"], version = ">=4.36.0"}
# Optional v1 dependencies
pydantic = {version = ">=2.6.0", optional = true}
eval-type-backport = {version = "^0.1.3", optional = true}
smart-open = {version = ">=7.0.0", optional = true}
tabulate = {version = ">=0.9.0", optional = true}

[tool.poetry.extras]
v1 = [
    "pydantic",
    "eval-type-backport",
    "smart-open",
    "tabulate",
]
all = [
    "pydantic", 
    "eval-type-backport",
    "smart-open",
    "tabulate",
]

[tool.poetry.group.dev.dependencies]
black = "^23.11.0"
isort = "^5.12.0"
mypy = "^1.7.1"
flake8 = "^7.0.0"
pytest = "7.1.3"
pytest-mock = "^3.14.0"

[tool.black]
line-length = 119

[tool.isort]
profile = "black"